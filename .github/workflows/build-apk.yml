name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP and Locate Project Root
        id: prepare-project
        run: |
          set -e
          echo "=== Searching for project ZIP archive ==="
          ZIP_FILE=""

          if [ -f "store-price-list (10).zip" ]; then
            ZIP_FILE="store-price-list (10).zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -q -o "$ZIP_FILE" -d extracted_project
            echo "ZIP extracted to directory: extracted_project"
          else
            echo "No ZIP archive found, using repository workspace directly."
          fi

          echo "=== Locating project root containing package.json and android/ ==="
          PROJECT_ROOT=""

          if [ -d "extracted_project" ]; then
            for candidate in extracted_project extracted_project/* extracted_project/*/*; do
              if [ -f "$candidate/package.json" ] && [ -d "$candidate/android" ]; then
                PROJECT_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            for candidate in . ./*; do
              if [ -f "$candidate/package.json" ] && [ -d "$candidate/android" ]; then
                PROJECT_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not locate a folder containing both package.json and android/ directory."
            exit 1
          fi

          PROJECT_ROOT_ABS=$(cd "$PROJECT_ROOT" && pwd)
          echo "Resolved project root: $PROJECT_ROOT_ABS"
          echo "project_root=$PROJECT_ROOT_ABS" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.prepare-project.outputs.project_root }}
        run: |
          echo "Installing npm dependencies..."
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build web application
        working-directory: ${{ steps.prepare-project.outputs.project_root }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ${{ steps.prepare-project.outputs.project_root }}
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.prepare-project.outputs.project_root }}/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug)
        working-directory: ${{ steps.prepare-project.outputs.project_root }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Store-Price-List-APK
          path: ${{ steps.prepare-project.outputs.project_root }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
